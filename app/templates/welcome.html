<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to AttendEase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-image: url('/static/images/bg.png');
            background-size: cover; /* <--- REVERTED */
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
        }
        .container {
            text-align: center;
        }
        .emblem {
            width: 100px;
            height: auto;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5em;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        p {
            font-size: 1.1em;
            color: #e0e0e0;
            margin-bottom: 40px;
        }
        .selection-box {
            display: inline-block;
            padding: 40px 60px;
            margin: 0 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.5em;
            transition: background-color 0.3s, transform 0.3s;
            
            /* Glassmorphism Effect */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .selection-box:hover {
            background-color: rgba(102, 126, 234, 0.5);
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/images/emblem.png" alt="Emblem" class="emblem">
        <h1>Welcome to AttendEase</h1>
        <p>Please select your role:</p>
        <div>
            <a href="/professor" class="selection-box">
                I am a <br><strong>Professor</strong>
            </a>
            <a href="/student" class="selection-box">
                I am a <br><strong>Student</strong>
            </a>
        </div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('gateway_token');

            if (token) {
                console.log('Gateway token found, setting cookie:', token);
                document.cookie = `gateway_token=${token}; path=/; max-age=3600`;
                window.history.replaceState({}, document.title, "/");
            }
        })();
    </script>
</body>
</html>
