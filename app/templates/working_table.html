<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Working Table Data</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 2em;
            background-image: url('/static/images/bg.png');
            background-size: cover; /* <--- REVERTED */
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .emblem {
            width: 60px;
            height: auto;
            opacity: 0.8;
            margin-right: 20px;
        }
        h1 {
            font-size: 2.5em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        p { color: #e0e0e0; }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px;
        }
        th, td { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
            text-align: left; 
            padding: 12px; 
        }
        th { 
            background-color: rgba(0, 0, 0, 0.3);
            font-size: 1.1em;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        a { color: #a7bfff; }
    </style>
</head>
<body>
    <div class="header">
        <img src="/static/images/emblem.png" alt="Emblem" class="emblem">
        <h1>Student UID Mapping</h1>
    </div>

    <div class="container">
        <p>This table shows the permanent mapping of a student's Roll Number to their unique ID (UID).</p>
        <table>
            <thead>
                <tr>
                    <th>Roll Number</th>
                    <th>UID</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.roll_no }}</td>
                    <td>{{ student.uid }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/professor">Back to Professor Dashboard</a>
    </div>
</body>
</html>
